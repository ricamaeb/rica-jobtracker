<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Job Application Board</title>
<style>
:root{
  --bg:#f7f5fb;--panel:#fff;--text:#2e2936;--muted:#81798f;--border:#e8e1f0;
  --purple:#8d72c9;--purple2:#6f56ad;--soft:#f0eafd;--danger:#c84b66;--green:#2f9364;
}
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--text)}
.app{max-width:1600px;margin:auto;padding:22px}.top{display:flex;gap:16px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-bottom:18px}.top h1{margin:0;font-size:28px}.top p{margin:5px 0 0;color:var(--muted);font-size:14px}.actions{display:flex;gap:9px;flex-wrap:wrap}button{border:0;border-radius:10px;padding:10px 14px;font-weight:750;cursor:pointer;font:inherit}.primary{background:var(--purple);color:white}.primary:hover{background:var(--purple2)}.secondary{background:var(--soft);color:var(--purple2)}.ghost{background:#fff;border:1px solid var(--border);color:var(--text)}
.stats{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:15px}.stat{background:#fff;border:1px solid var(--border);border-radius:12px;padding:9px 12px;font-size:13px;color:var(--muted)}.stat strong{color:var(--text);font-size:17px;margin-right:5px}.toolbar{display:grid;grid-template-columns:minmax(220px,1.5fr) minmax(150px,.7fr) auto;gap:10px;margin-bottom:16px}.toolbar input,.toolbar select{border:1px solid var(--border);border-radius:10px;background:#fff;padding:11px 12px;font:inherit;outline:none}.toolbar input:focus,.toolbar select:focus{border-color:#baa8e2;box-shadow:0 0 0 3px rgba(141,114,201,.12)}
.board-wrap{overflow-x:auto;padding-bottom:14px}.board{display:grid;grid-template-columns:repeat(5,minmax(270px,1fr));gap:14px;min-width:1430px;align-items:start}.column{background:#f0edf4;border:1px solid #e5dfea;border-radius:14px;min-height:520px;padding:10px}.column.drag-over{outline:2px dashed var(--purple);outline-offset:-4px;background:#ece4fb}.column-head{display:flex;align-items:center;justify-content:space-between;padding:5px 5px 10px}.column-title{font-weight:850}.count{background:#fff;border:1px solid var(--border);border-radius:999px;min-width:27px;padding:3px 8px;text-align:center;font-size:12px;color:var(--muted)}.cards{display:flex;flex-direction:column;gap:9px;min-height:450px}.card{background:#fff;border:1px solid var(--border);border-radius:12px;padding:13px;box-shadow:0 3px 12px rgba(42,32,56,.04);cursor:grab}.card:active{cursor:grabbing}.card.dragging{opacity:.45}.card-title{font-weight:850;margin:0 0 4px;font-size:15px}.card-role{color:var(--muted);font-size:13px;margin-bottom:10px}.meta{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:9px}.pill{font-size:11px;border-radius:999px;padding:4px 7px;background:#f7f3fb;color:#6d6379}.pill.due{background:#fff0f3;color:var(--danger);font-weight:800}.pill.soon{background:#fff7e8;color:#9a6a16;font-weight:800}.notes{font-size:12px;color:#655d70;line-height:1.45;margin:7px 0}.card-actions{display:flex;gap:6px;justify-content:flex-end;margin-top:10px}.card-actions button{padding:6px 8px;font-size:12px}.move-select{width:100%;margin-top:9px;border:1px solid var(--border);border-radius:9px;padding:8px;background:#fff;color:var(--text);font-size:12px}.empty{border:1px dashed #d8cfdf;border-radius:10px;padding:20px 10px;text-align:center;color:#9a91a5;font-size:12px}.job-link{color:var(--purple2);font-size:12px;font-weight:700;text-decoration:none}.job-link:hover{text-decoration:underline}
dialog{width:min(720px,calc(100vw - 28px));border:0;border-radius:17px;padding:0;box-shadow:0 25px 70px rgba(42,30,58,.28)}dialog::backdrop{background:rgba(33,25,42,.42)}.modal-head{display:flex;justify-content:space-between;align-items:center;padding:18px 20px;border-bottom:1px solid var(--border)}.modal-head h2{margin:0;font-size:20px}.close{background:transparent;color:var(--muted);font-size:24px;padding:0 8px}.modal-body{padding:20px}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:13px}.full{grid-column:1/-1}label{display:block;font-size:11px;letter-spacing:.05em;text-transform:uppercase;font-weight:800;color:var(--muted);margin-bottom:5px}input,select,textarea{width:100%;border:1px solid var(--border);border-radius:9px;padding:10px;font:inherit;outline:none}textarea{min-height:92px;resize:vertical}.modal-actions{display:flex;justify-content:flex-end;gap:9px;margin-top:17px}.helper{font-size:12px;color:var(--muted);margin:0 0 14px;background:#f7f3fc;border-radius:9px;padding:10px}.footer{font-size:12px;color:var(--muted);margin-top:4px}
@media(max-width:700px){.app{padding:14px}.toolbar{grid-template-columns:1fr}.form-grid{grid-template-columns:1fr}.full{grid-column:auto}.top h1{font-size:23px}}
</style>
</head>
<body>
<div class="app">
  <div class="top">
    <div><h1>💜 Job Application Board</h1><p>Drag applications between stages just like a ClickUp board.</p></div>
    <div class="actions"><button class="ghost" id="exportBtn">Export CSV</button><button class="primary" id="addBtn">+ Add Application</button></div>
  </div>
  <div class="stats" id="stats"></div>
  <div class="toolbar">
    <input id="search" type="search" placeholder="Search company, role, contact, notes..." />
    <select id="priorityFilter"><option value="">All priorities</option><option>High</option><option>Medium</option><option>Low</option></select>
    <button class="secondary" id="followBtn">Follow-ups Due</button>
  </div>
  <div class="board-wrap"><div class="board" id="board"></div></div>
  <p class="footer">Autosaves in your browser. You can drag cards on desktop, or use the Move to… dropdown on each card.</p>
</div>
<dialog id="dlg">
  <form id="form">
    <div class="modal-head"><h2 id="modalTitle">Add Application</h2><button class="close" type="button" id="closeBtn">×</button></div>
    <div class="modal-body">
      <p class="helper">When you add a date applied, the tracker suggests a follow-up 5 days later. You can change it.</p>
      <div class="form-grid">
        <div><label>Company *</label><input id="company" required /></div>
        <div><label>Job Title *</label><input id="role" required /></div>
        <div><label>Stage</label><select id="stage"></select></div>
        <div><label>Priority</label><select id="priority"><option>High</option><option selected>Medium</option><option>Low</option></select></div>
        <div><label>Date Applied</label><input id="dateApplied" type="date" /></div>
        <div><label>Follow-up Date</label><input id="followUp" type="date" /></div>
        <div><label>Contact Person</label><input id="contact" /></div>
        <div><label>Contact Email</label><input id="email" type="email" /></div>
        <div><label>Salary / Rate</label><input id="salary" placeholder="e.g. ₱40,000/month" /></div>
        <div><label>Job Link</label><input id="jobLink" type="url" placeholder="https://..." /></div>
        <div class="full"><label>Notes</label><textarea id="notes"></textarea></div>
      </div>
      <div class="modal-actions"><button type="button" class="ghost" id="cancelBtn">Cancel</button><button type="submit" class="primary">Save</button></div>
    </div>
  </form>
</dialog>
<script>
const STAGES=['To Apply','Applied','Interview','Offer','Rejected'];
const KEY='jobApplicationKanban_v2';
let data=JSON.parse(localStorage.getItem(KEY)||'[]');
let editing=null, dueOnly=false, draggedId=null;
const el=id=>document.getElementById(id);
function today(){const d=new Date();return [d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-')}
function addDays(s,n){if(!s)return'';const [y,m,d]=s.split('-').map(Number);const x=new Date(y,m-1,d);x.setDate(x.getDate()+n);return [x.getFullYear(),String(x.getMonth()+1).padStart(2,'0'),String(x.getDate()).padStart(2,'0')].join('-')}
function esc(s=''){return String(s).replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;').replaceAll("'",'&#039;')}
function save(){localStorage.setItem(KEY,JSON.stringify(data));render()}
function needsFollow(x){return x.followUp&&x.followUp<=today()&&!['Offer','Rejected'].includes(x.stage)}
function followState(x){if(!x.followUp)return'';if(needsFollow(x))return'due';if(x.followUp<=addDays(today(),2)&&!['Offer','Rejected'].includes(x.stage))return'soon';return''}
function stats(){return `<div class="stat"><strong>${data.length}</strong>Total</div><div class="stat"><strong>${data.filter(x=>x.stage==='Applied').length}</strong>Applied</div><div class="stat"><strong>${data.filter(x=>x.stage==='Interview').length}</strong>Interview</div><div class="stat"><strong>${data.filter(x=>x.stage==='Offer').length}</strong>Offers</div><div class="stat"><strong>${data.filter(needsFollow).length}</strong>Follow-ups due</div>`}
function render(){el('stats').innerHTML=stats();const q=el('search').value.trim().toLowerCase();const p=el('priorityFilter').value;const filtered=data.filter(x=>{const hay=[x.company,x.role,x.contact,x.email,x.notes,x.salary].join(' ').toLowerCase();return(!q||hay.includes(q))&&(!p||x.priority===p)&&(!dueOnly||needsFollow(x))});el('board').innerHTML=STAGES.map(stage=>{const items=filtered.filter(x=>x.stage===stage);return `<section class="column" data-stage="${esc(stage)}"><div class="column-head"><span class="column-title">${esc(stage)}</span><span class="count">${items.length}</span></div><div class="cards">${items.length?items.map(cardHTML).join(''):'<div class="empty">Drop jobs here</div>'}</div></section>`}).join('');bindCards()}
function cardHTML(x){const f=followState(x);return `<article class="card" draggable="true" data-id="${x.id}"><div class="card-title">${esc(x.company)}</div><div class="card-role">${esc(x.role)}</div><div class="meta"><span class="pill">${esc(x.priority||'Medium')} priority</span>${x.dateApplied?`<span class="pill">Applied ${esc(x.dateApplied)}</span>`:''}${x.followUp?`<span class="pill ${f}">Follow-up ${esc(x.followUp)}</span>`:''}</div>${x.salary?`<div class="notes"><strong>Rate:</strong> ${esc(x.salary)}</div>`:''}${x.notes?`<div class="notes">${esc(x.notes.slice(0,130))}${x.notes.length>130?'…':''}</div>`:''}${x.jobLink?`<a class="job-link" href="${esc(x.jobLink)}" target="_blank" rel="noopener">Open job post ↗</a>`:''}<select class="move-select" data-move="${x.id}" aria-label="Move ${esc(x.company)} to another stage">${STAGES.map(s=>`<option ${s===x.stage?'selected':''}>${s}</option>`).join('')}</select><div class="card-actions"><button type="button" class="secondary edit" data-edit="${x.id}">Edit</button><button type="button" class="ghost del" data-del="${x.id}">Delete</button></div></article>`}
function bindCards(){document.querySelectorAll('.card').forEach(c=>{c.addEventListener('dragstart',()=>{draggedId=c.dataset.id;c.classList.add('dragging')});c.addEventListener('dragend',()=>{draggedId=null;c.classList.remove('dragging');document.querySelectorAll('.column').forEach(x=>x.classList.remove('drag-over'))})});document.querySelectorAll('.column').forEach(col=>{col.addEventListener('dragover',e=>{e.preventDefault();col.classList.add('drag-over')});col.addEventListener('dragleave',()=>col.classList.remove('drag-over'));col.addEventListener('drop',e=>{e.preventDefault();col.classList.remove('drag-over');if(!draggedId)return;const item=data.find(x=>x.id===draggedId);if(item){item.stage=col.dataset.stage;save()}})});document.querySelectorAll('[data-move]').forEach(s=>s.addEventListener('change',()=>{const x=data.find(v=>v.id===s.dataset.move);if(x){x.stage=s.value;save()}}));document.querySelectorAll('[data-edit]').forEach(b=>b.addEventListener('click',()=>openForm(b.dataset.edit)));document.querySelectorAll('[data-del]').forEach(b=>b.addEventListener('click',()=>{const x=data.find(v=>v.id===b.dataset.del);if(x&&confirm(`Delete ${x.company} — ${x.role}?`)){data=data.filter(v=>v.id!==x.id);save()}}))}
function openForm(id=null){editing=id;el('form').reset();el('stage').innerHTML=STAGES.map(s=>`<option>${s}</option>`).join('');el('priority').value='Medium';el('stage').value='Applied';el('dateApplied').value=today();el('followUp').value=addDays(today(),5);el('modalTitle').textContent=id?'Edit Application':'Add Application';if(id){const x=data.find(v=>v.id===id);['company','role','stage','priority','dateApplied','followUp','contact','email','salary','jobLink','notes'].forEach(k=>el(k).value=x[k]||'')}el('dlg').showModal()}
function closeForm(){el('dlg').close();editing=null}
el('dateApplied').addEventListener('change',()=>{if(el('dateApplied').value)el('followUp').value=addDays(el('dateApplied').value,5)});
el('form').addEventListener('submit',e=>{e.preventDefault();const obj={company:el('company').value.trim(),role:el('role').value.trim(),stage:el('stage').value,priority:el('priority').value,dateApplied:el('dateApplied').value,followUp:el('followUp').value,contact:el('contact').value.trim(),email:el('email').value.trim(),salary:el('salary').value.trim(),jobLink:el('jobLink').value.trim(),notes:el('notes').value.trim()};if(editing){const i=data.findIndex(x=>x.id===editing);data[i]={...data[i],...obj}}else data.unshift({id:(crypto.randomUUID?crypto.randomUUID():String(Date.now())),...obj});save();closeForm()});
el('addBtn').addEventListener('click',()=>openForm());el('closeBtn').addEventListener('click',closeForm);el('cancelBtn').addEventListener('click',closeForm);el('search').addEventListener('input',render);el('priorityFilter').addEventListener('change',render);el('followBtn').addEventListener('click',()=>{dueOnly=!dueOnly;el('followBtn').textContent=dueOnly?'Show All':'Follow-ups Due';render()});
el('exportBtn').addEventListener('click',()=>{if(!data.length){alert('No applications to export yet.');return}const headers=['Company','Role','Stage','Priority','Date Applied','Follow-up','Contact','Email','Salary','Job Link','Notes'];const rows=data.map(x=>[x.company,x.role,x.stage,x.priority,x.dateApplied,x.followUp,x.contact,x.email,x.salary,x.jobLink,x.notes]);const csv=[headers,...rows].map(r=>r.map(v=>`"${String(v||'').replaceAll('"','""')}"`).join(',')).join('\n');const blob=new Blob([csv],{type:'text/csv'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='job-applications.csv';a.click();URL.revokeObjectURL(a.href)});
render();
</script>
</body>
</html>
